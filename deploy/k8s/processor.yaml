# Processor: each replica joins the same Redis consumer group, so messages are split
# between replicas and each reading is handled by exactly one of them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-processor
  labels: { app: fleet-processor }
spec:
  replicas: 2
  selector:
    matchLabels: { app: fleet-processor }
  template:
    metadata:
      labels: { app: fleet-processor }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      securityContext: { runAsNonRoot: true }
      terminationGracePeriodSeconds: 30
      containers:
        - name: processor
          image: ghcr.io/narinehzargarian/fleet-telemetry-monitor:latest
          command: ["/usr/local/bin/processor"]
          ports: [{ containerPort: 9091 }]
          env:
            # The pod name is unique, so each replica gets its own consumer identity.
            - name: CONSUMER_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          envFrom:
            - secretRef: { name: fleet-secrets }
          livenessProbe:
            httpGet: { path: /healthz, port: 9091 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
