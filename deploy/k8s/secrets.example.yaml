# Example only. Create the real secret with scripts/k8s-secret.sh (values come from your
# environment, never from git). In AWS these values come from Secrets Manager via Terraform.
apiVersion: v1
kind: Secret
metadata:
  name: fleet-secrets
type: Opaque
stringData:
  DATABASE_URL: postgres://fleet:CHANGE_ME@postgres:5432/fleet?sslmode=require
  REDIS_ADDR: redis:6379
  INGEST_TOKEN: CHANGE_ME
