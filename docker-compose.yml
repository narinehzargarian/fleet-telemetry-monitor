# Full local stack: `docker compose up --build`, then open
#   dashboard  http://localhost:5173
#   API        http://localhost:8080/api/v1/stations
#   Prometheus http://localhost:9090
#   Grafana    http://localhost:3000 (anonymous viewer)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  api:
    build: .
    entrypoint: ["/usr/local/bin/server"]
    environment:
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet?sslmode=disable
      REDIS_ADDR: redis:6379
      INGEST_TOKEN: ${INGEST_TOKEN:-local-dev-token}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  processor:
    build: .
    entrypoint: ["/usr/local/bin/processor"]
    environment:
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  simulator:
    build: .
    entrypoint: ["/usr/local/bin/simulator", "-api", "http://api:8080", "-stations", "8"]
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-local-dev-token}
    depends_on: [api]

  dashboard:
    build: ./dashboard
    environment:
      VITE_API_URL: http://localhost:8080
    ports: ["5173:80"]
    depends_on: [api]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
